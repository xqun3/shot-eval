name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional optimizer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[optimizer]"
      - name: Compile package
        run: python -m compileall -q .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check no obvious credential patterns
        run: |
          ! grep -RInE --exclude-dir=.git --exclude-dir=__pycache__ \
            '(AIza[0-9A-Za-z_-]{20,}|bsk-[A-Za-z0-9_-]+|sk-[A-Za-z0-9_-]{16,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY)' .
